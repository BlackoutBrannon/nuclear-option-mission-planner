<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NO Mission Planner</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app">

    <aside id="panel">
      <div id="panelHead">Nuclear Option — Mission Planner</div>

      <div id="panelBody">
        <div id="drop">Drop a mission .json here</div>

        <div class="group">
          <div class="title">Your faction</div>
          <select id="faction"></select>
        </div>

        <div class="group">
          <div class="title">Layers</div>
          <div id="layerTree"></div>
        </div>

        <div class="group">
          <div class="title">Mission</div>
          <pre id="out"></pre>
        </div>

        <div class="group">
          <a href="symbols.html" target="_blank" class="sheetLink">Symbology sheet &rarr;</a>
        </div>
      </div>
    </aside>

    <main id="mapArea">
      <canvas id="map"></canvas>
    </main>

  </div>

  <div id="tip"></div>
  <div id="menu"></div>

  <div id="status">
    <span id="stPos">—</span>
    <span id="stBull"></span>
    <span id="stMeas"></span>
    <button id="unitToggle" title="Switch between nautical and metric">NM / ft</button>
  </div>

  <!-- milsymbol 2.2.0 - MIT, Mans Beckman / spatialillusions.com.
       Renders MIL-STD-2525 symbols from a SIDC string. Vendored rather than
       loaded from a CDN so the planner works offline and cannot break when
       someone else's server changes. Exposes the global `ms`. -->
  <script src="vendor/milsymbol.js"></script>

  <script src="app.js"></script>
</body>
</html>
