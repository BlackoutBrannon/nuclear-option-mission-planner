<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NO Mission Planner</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #12181d;
      color: #e6edf3;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid #2a353d;
      font-weight: 600;
    }
    main { padding: 20px; }
    #drop {
      border: 2px dashed #3d4a55;
      border-radius: 6px;
      padding: 60px 20px;
      text-align: center;
      color: #8b98a5;
    }
    #out {
      margin-top: 20px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <header>Nuclear Option — Mission Planner</header>

  <main>
    <div id="drop">Drop a mission .json here</div>
    <div style="margin-top:12px;">
  Your faction:
  <select id="faction" style="background:#1c262d; color:#e6edf3; border:1px solid #3d4a55; padding:4px;"></select>
</div>
    <pre id="out"></pre>
    <canvas id="map" width="800" height="800" style="border:1px solid #2a535d; margin-top:20px;"></canvas>
  </main>

  <script>
  const drop = document.getElementById('drop');
const out  = document.getElementById('out');

const factionSelect = document.getElementById('faction');

function mapName(path) {
    if (path ==='Terrain_naval') return 'Ignus Archipelago';
    return 'Heartland';
}

const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d')

const MAPS = {
    'Heartland': {
        image: 'Heartland_overview.png',
        minX: -40960,   maxX: 40960,
        minZ: -40960,   maxZ: 40960
    },
    'Ignus Archipelago': {
        image: 'Ignus_overview.png',
        minX: -78072.9, maxX: 79573.5,
        minZ: -39419.9, maxZ: 37316.3
    }
};

let currentMap = null;
const basemap  = new Image();
let currentMission = null;

basemap.onload = () => {
  if (currentMission) draw(currentMission);
};

function setMap(name) {
    currentMap  = MAPS[name];
    basemap.src = currentMap.image;

    const width  = 900;
    const aspect = (currentMap.maxX - currentMap.minX) / (currentMap.maxZ - currentMap.minZ);
    canvas.width  = width;
    canvas.height = Math.round(width / aspect);
}

function toScreen(x, z) {
    const m = currentMap;
    const u = (x - m.minX) / (m.maxX - m.minX);
    const v = (m.maxZ - z) / (m.maxZ - m.minZ);
    return { x: u * canvas.width, y: v * canvas.height };
}

function collectUnits(mission) {
    const units = [];

    for (const category of ['aircraft', 'vehicles', 'ships', 'buildings']) {
        for (const u of mission[category] || []) {
            units.push({
                category: category,
                type:     u.type,
                faction:  u.faction,
                x:        u.globalPosition.x,
                z:        u.globalPosition.z
            });
        }
    }

    return units;
}

let myFaction = null;

function affiliationOf(unit) {
    if (!myFaction) return 'unknown';
    return unit.faction === myFaction ? 'friend' : 'hostile';
}

const AFFIL_FILL = {
    friend:  '#8ecbff',
    hostile: '#ff9a9a',
    unknown: '#ffe08a'
};

function drawFrame(ctx, x, y, size, affiliation) {
    ctx.beginPath();

    if (affiliation === 'hostile') {
        ctx.moveTo(x, y - size);
        ctx.lineTo(x + size, y);
        ctx.lineTo(x, y + size);
        ctx.lineTo(x - size, y);
        ctx.closePath();
    } else if (affiliation === 'friend') {
        ctx.rect(x - size, y - size * 0.7, size * 2, size * 1.4);
    } else {
        ctx.rect(x - size, y - size, size * 2, size * 2);
    }

    ctx.fillStyle = AFFIL_FILL[affiliation];
    ctx.fill();
    ctx.stroke();
}
const FACTION_LABELS = {
    'Boscali': 'BDF',
    'Primeva': 'PALA'
};

function factionLabel(name) {
    return FACTION_LABELS[name] || name;
}
function populateFactions(mission) {
    factionSelect.innerHTML = '';

    for (const f of mission.factions) {
        const option = document.createElement('option');
        option.value       = f.factionName;
        option.textContent = factionLabel(f.factionName);
        factionSelect.appendChild(option);
    }

    factionSelect.value = myFaction;
}

factionSelect.addEventListener('change', () => {
    myFaction = factionSelect.value;
    if (currentMission) draw(currentMission);
});

function draw(mission) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(basemap, 0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#101418';
    ctx.lineWidth   = 1.5;

    for (const unit of collectUnits(mission)) {
        const p = toScreen(unit.x, unit.z);
        drawFrame(ctx, p.x, p.y, 5, affiliationOf(unit));
    }};

drop.addEventListener('dragover', (e) => {
  e.preventDefault();
  drop.style.borderColor = '#5aa9d6';
});
    drop.addEventListener('dragleave', () => {
  drop.style.borderColor = '#3d4a55';
});

drop.addEventListener('drop', async (e) => {
  e.preventDefault();
  drop.style.borderColor = '#3d4a55';

  const file = e.dataTransfer.files[0];
  const text = await file.text();

  const mission = JSON.parse(text);

out.textContent = `${file.name}


map:       ${mapName(mission.MapKey.Path)}
aircraft:  ${mission.aircraft.length}
vehicles:  ${mission.vehicles.length}
ships:     ${mission.ships.length}
buildings: ${mission.buildings.length}`;

  setMap(mapName(mission.MapKey.Path));
  draw(mission);
    myFaction = mission.factions[0].factionName;
      populateFactions(mission);
  currentMission = mission;
  setMap(mapName(mission.MapKey.Path));
  draw(mission);
});
  </script>
</body>
</html>
